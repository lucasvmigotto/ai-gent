schema_version: "1.1"
name: spec-bootstrap
description: Behavior — project:spec bootstraps Spec Kit in a repository that already has docs/product/ (it used to fail with "Current directory is not empty")
tags: [behavior]
runs: 1
execution:
  prompt: |
    Run only step 1 of project:spec ("Bootstrap Spec Kit") in this repository, then stop.
    Don't write the constitution or any spec, and don't commit anything.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - name: templates-installed
    type: file_exists
    path: .specify/templates/spec-template.md
  - name: speckit-skills-installed
    type: file_exists
    path: .claude/skills/speckit-specify/SKILL.md
  - name: no-git-extension
    type: tool_used
    tool: Bash
    input_match: 'specify init[^"]*--extension git'
    min: 0
    max: 0
    arm: both
