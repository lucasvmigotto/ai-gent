schema_version: "1.1"
name: spec-bootstrap
description: Behavior — project:spec runs specify init with --here and --force in a repository that already has docs/product/ (it used to fail with "Current directory is not empty")
tags: [behavior]
runs: 1
execution:
  prompt: |
    Run only step 1 of project:spec ("Bootstrap Spec Kit") in this repository, then stop.
    Don't write the constitution or any spec, and don't commit anything.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  # The eval sandbox replaces .claude/ entries with placeholders, so the Claude
  # integration can't write its skills and init can't finish there. The bug this
  # case guards was the command itself (no --here/--force in a non-empty repo):
  # check that, flags in any order.
  - name: init-command
    type: tool_used
    tool: Bash
    input_match: 'specify init(?=[^"]*--here)(?=[^"]*--force)(?=[^"]*--integration claude)(?=[^"]*--non-interactive)'
    min: 1
    arm: both
  - name: no-git-extension
    type: tool_used
    tool: Bash
    input_match: 'specify init[^"]*--extension git'
    min: 0
    max: 0
    arm: both
