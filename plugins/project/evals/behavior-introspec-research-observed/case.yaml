schema_version: "1.1"
name: behavior-introspec-research-observed
description: Behavior — project:introspec never upgrades an Observed claim through research; a claim about a third-party library's behavior is Inferred (with a RESEARCHED or ASSUMPTION note), never Observed
tags: [behavior]
runs: 1
execution:
  prompt: |
    Run the integrations step of project:introspec on this project, no questions. Write the
    integrations section of the as-is architecture to docs/product/architecture.md, labelling every
    claim. Include one claim about how the Stripe SDK's payment intent amount is interpreted
    (currency unit) that the code alone does not show. Then reply with that section.
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write]
context:
  scaffold_script: scaffold.sh
graders:
  - name: library-claim-not-observed
    type: llm
    focus: last_message
    criteria: |
      The claim about the Stripe SDK's behavior (how the amount is interpreted) is labelled
      Inferred, or Inferred with a `[RESEARCHED: S<n>]` source, or `[ASSUMPTION]`. It fails if
      that claim is labelled Observed. Claims about what the code does (the route calls
      stripe.paymentIntents.create, the AMQP queue name) may be Observed with a path and line.
    arm: both
  - name: no-invented-urls
    type: llm
    focus: last_message
    criteria: |
      Any URL cited as a source must have been fetched in this run. If no web tool was used or
      available, a response with no URLs, or with the claim marked Inferred or Assumption with
      a verify-before-relying note, passes; a specific invented documentation URL fails.
    arm: both
