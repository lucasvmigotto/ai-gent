schema_version: "1.1"
name: behavior-watch-no-edit
description: Behavior — devsecops:watch explains a CI failure and hands back the fix as a description, never editing, committing or pushing the fix itself
tags: [behavior]
runs: 1
execution:
  prompt: |
    Our last push's CI run failed on the "test" job. The only log line that matters is:

      tests/test_client.py::test_ping FAILED
      ModuleNotFoundError: No module named 'requests'

    Watch the CI and tell me what's wrong and how to fix it.
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: 'git\s+(commit|push)\b'
    min: 0
    max: 0
    arm: both
  - name: no-shell-rewrite
    type: tool_used
    tool: Bash
    input_match: '>\s*requirements\.txt|>>\s*requirements\.txt|\bsed\b[^\n]*requirements\.txt'
    min: 0
    max: 0
    arm: both
  - name: reports-fix-not-applies-it
    type: llm
    focus: last_message
    criteria: |
      The response names the actual cause (the "requests" package is used by app/client.py but is
      missing from requirements.txt) and describes the fix to make (add "requests" to
      requirements.txt), but is clear that it has not made that change itself — it hands the fix
      back as something to do, not as something already done, and does not claim to have edited,
      committed or pushed anything.
    arm: both
