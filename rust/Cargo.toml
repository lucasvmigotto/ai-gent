[workspace]
resolver = "3"
members = ["crates/ai-gent-core", "crates/ai-gent"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/lucasvmigotto/ai-gent"
homepage = "https://docs.lucasvmigotto.me/ai-gent/"
authors = ["Lucas Migotto"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
tempfile = "3"
# Linear-time matching for the guard rules (spec 033). No Unicode tables, no SIMD: the patterns are ASCII
# and the binary is size-budgeted.
regex = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Size over speed: the CLI is short-lived and the archive is downloaded once per install.
# Measured numbers are in specs/032-rust-workspace-and-release/data-model.md (size budget).
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "unwind"
