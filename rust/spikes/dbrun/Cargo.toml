[package]
name = "dbrun-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spec 038 spike: not part of the ai-gent workspace, never published or shipped."
license = "GPL-3.0-or-later"

[lib]
name = "dbcore"
path = "src/lib.rs"

[[bin]]
name = "dbq"
path = "src/main.rs"

[features]
default = []
sqlite = ["dep:rusqlite"]
pg = ["dep:postgres"]
mysql = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
all = ["sqlite", "pg", "mysql", "mssql"]
parser = ["dep:sqlparser"]

[dependencies]
regex = "1"
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "hooks"], optional = true }
postgres = { version = "0.19", optional = true }
mysql = { version = "28", default-features = false, features = ["minimal"], optional = true }
tiberius = { package = "tiberius-ng", version = "0.13", default-features = false, features = ["tds73", "rustls"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
sqlparser = { version = "0.63", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Standalone: its own lockfile and dependency tree, outside the ai-gent workspace and its cargo-deny gate.
[workspace]

[[bin]]
name = "sqlite-exec"
path = "src/bin/sqlite-exec.rs"
required-features = ["sqlite"]
