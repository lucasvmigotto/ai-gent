[package]
name = "ai-gent-compact"
version = "0.1.0"
description = "Token-lean source code reader of ai-gent: compact views and outlines of source files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ai-agent", "claude-code", "tokens", "source-code"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/README.md"]  # the language table is src/data/compact-langs.rs

[lib]
name = "ai_gent_compact"
path = "src/lib.rs"

[[bin]]
name = "ai-gent-compact"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-css = "0.25"
tree-sitter-scss = "1"

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates = "3"

[lints]
workspace = true
