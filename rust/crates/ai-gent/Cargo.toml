[package]
name = "ai-gent"
version = "0.1.0"
description = "Command line of ai-gent: skills and plugins for AI coding agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ai-agent", "claude-code", "skills", "cli"]
categories = ["command-line-utilities"]
include = ["/src/**", "/README.md"]

[[bin]]
name = "ai-gent"
path = "src/main.rs"

# The fake container engine of the `wt` parity tests. An example is built by `cargo test` and never by
# `cargo build --release`.
[[example]]
name = "ai-gent-fake-engine"
path = "examples/fake_engine.rs"

[dependencies]
ai-gent-core = { path = "../ai-gent-core", version = "0.1.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `wt` test hooks (fake disk usage and builds, no engine): compiled only when testing.
ai-gent-core = { path = "../ai-gent-core", features = ["test-support"] }
assert_cmd.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
