name: release

# Every push to main runs the checks, then releases if the commits since the
# last tag warrant it. scripts/release.py decides: feat → minor; fix, perf,
# refactor → patch; "type!:" or BREAKING CHANGE → major; anything else → no
# release. A release bumps the changed plugins' versions, promotes
# CHANGELOG.md's "## Unreleased" (or generates a section), commits
# "chore(release): X.Y.Z", tags X.Y.Z, publishes a GitHub Release and merges
# the release back into dev. The Rust binaries are built for six targets after the
# tag exists (rust-build), packaged one archive per target beside the content-only
# package, attested and attached before the release is published (package), and
# the crates are published to crates.io only when the repository variable
# AI_GENT_CRATES_PUBLISH is "true" (publish-crates; unset means never).
#
# The bot pushes that commit and tag straight to main with GITHUB_TOKEN:
# branch protection or a ruleset that requires pull requests (or doesn't let
# github-actions[bot] bypass it) rejects the push. Pushes made with
# GITHUB_TOKEN don't trigger workflows, so the release commit can't loop; the
# chore(release) condition below is a second guard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and tag, create the release
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the last tag
          fetch-tags: true
          persist-credentials: true # the push below uses the checkout's GITHUB_TOKEN

      - name: Plan
        id: plan
        run: |
          set +e
          python3 scripts/release.py --dry-run
          code=$?
          set -e
          case "$code" in
            0) echo "release=true" >>"$GITHUB_OUTPUT" ;;
            3) echo "release=false" >>"$GITHUB_OUTPUT"; echo "No release needed." ;;
            *) exit "$code" ;;
          esac

      - name: Release
        id: release
        if: ${{ steps.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898496+github-actions[bot]@users.noreply.github.com"
          version="$(python3 scripts/release.py)"
          python3 scripts/release.py --notes "$version" >"$RUNNER_TEMP/notes.md"
          git add CHANGELOG.md plugins/*/.claude-plugin/plugin.json docs/site/package.json
          # release.py wrote the crate versions and the lock (no cargo needed here); rust-build proves them consistent
          if [ -f rust/Cargo.lock ]; then git add rust/crates/*/Cargo.toml rust/Cargo.lock; fi
          git commit -m "chore(release): $version"
          git tag -a "$version" -m "$version"
          # Rejected (and nothing published) if main moved since this run started;
          # the next run releases those commits too.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$version"
          # A draft until the package job below has attached the tarball: the
          # installer and update-check resolve "latest" to published releases only.
          gh release create "$version" --draft --title "$version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # Back-merge: bring the release commit and tag into dev, so its
          # plugin versions and CHANGELOG don't lag. dev's ruleset requires
          # pull requests and a personal-account repo can't let
          # github-actions bypass it, so this push is refused and warns with
          # the command the owner runs (on purpose: no deploy key or PAT).
          integ=dev
          if git ls-remote --exit-code --heads origin "$integ" >/dev/null 2>&1; then
            git fetch -q origin "$integ"
            git switch -q -C "$integ" "origin/$integ"
            if ! { git merge --no-ff -m "chore(release): merge $version back into $integ" "$version" && git push origin "$integ"; }; then
              git merge --abort 2>/dev/null || true
              echo "::warning::back-merge of $version into $integ failed; run: git switch $integ && git merge --no-ff $version && git push"
            fi
          fi

  # The binary for each target, built natively from the tagged commit. release.py wrote the
  # versions and Cargo.lock in the release commit (cargo is not needed there); the lock is
  # proved consistent by `cargo metadata --locked` in every leg.
  rust-build:
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    uses: ./.github/workflows/rust-build.yml
    permissions:
      contents: read
    with:
      ref: refs/tags/${{ needs.release.outputs.version }}
      release: ${{ needs.release.outputs.version }}
      dry_run: false

  # Builds the release packages for the new tag (the content-only one and one per target),
  # attests their provenance, attaches them to the (draft) release and publishes the release.
  # Only this job holds attestations write (and publish-crates holds id-token for crates.io).
  # scripts/package.py --check runs the same build without publishing (scripts/check.sh,
  # on every PR), and rust.yml rehearses this job's script on every Rust change.
  package:
    needs: [release, rust-build]
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # attach assets to the release and publish it
      id-token: write # the OIDC token the attestation is signed with
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: The tag is this commit, and the binary crate carries its version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"
          grep -qx "version = \"$VERSION\"" rust/crates/ai-gent/Cargo.toml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins

      - name: Build the packages, SHA256SUMS and the release notes
        run: |
          set -euo pipefail
          python3 scripts/release.py --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          scripts/package-release.sh --version "$VERSION" --bins bins --out dist --notes "$RUNNER_TEMP/notes.md"
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ai-gent-${{ needs.release.outputs.version }}.tar.gz
            dist/ai-gent-${{ needs.release.outputs.version }}-*.tar.gz
            dist/ai-gent-${{ needs.release.outputs.version }}-*.zip
            dist/install.sh

      - name: Attach to the release, then publish it
        run: |
          set -euo pipefail
          gh release upload "$VERSION" dist/ai-gent-"$VERSION".tar.gz dist/ai-gent-"$VERSION"-*.tar.gz dist/ai-gent-"$VERSION"-*.zip dist/SHA256SUMS dist/install.sh --clobber
          # The notes gain the ## Checksums block (D25) before the release stops being a draft.
          gh release edit "$VERSION" --notes-file dist/release-notes.md
          gh release edit "$VERSION" --draft=false --latest

  # crates.io through Trusted Publishing (OIDC, no stored token), only when the owner has set
  # AI_GENT_CRATES_PUBLISH=true. Idempotent: scripts/rust-publish.sh skips a version crates.io
  # already has. The environment is the one the crates were configured with on crates.io.
  publish-crates:
    needs: [release, rust-build]
    if: ${{ vars.AI_GENT_CRATES_PUBLISH == 'true' && needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crate-release
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Rust toolchain (pinned by rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      - name: Metadata gate (packaged Cargo.toml of every crate)
        run: scripts/rust-publish.sh metadata

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish in dependency order, skipping versions already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/rust-publish.sh publish

  report-failure:
    needs: [check, release, rust-build, package, publish-crates]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/report-failure.yml
