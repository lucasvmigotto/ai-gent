name: release

# Every push to main runs the checks, then releases if the commits since the
# last tag warrant it. scripts/release.py decides: feat → minor; fix, perf,
# refactor → patch; "type!:" or BREAKING CHANGE → major; anything else → no
# release. A release bumps the changed plugins' versions, promotes
# CHANGELOG.md's "## Unreleased" (or generates a section), commits
# "chore(release): X.Y.Z", tags X.Y.Z, publishes a GitHub Release and merges
# the release back into dev.
#
# The bot pushes that commit and tag straight to main with GITHUB_TOKEN:
# branch protection or a ruleset that requires pull requests (or doesn't let
# github-actions[bot] bypass it) rejects the push. Pushes made with
# GITHUB_TOKEN don't trigger workflows, so the release commit can't loop; the
# chore(release) condition below is a second guard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and tag, create the release
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the last tag
          fetch-tags: true
          persist-credentials: true # the push below uses the checkout's GITHUB_TOKEN

      - name: Plan
        id: plan
        run: |
          set +e
          python3 scripts/release.py --dry-run
          code=$?
          set -e
          case "$code" in
            0) echo "release=true" >>"$GITHUB_OUTPUT" ;;
            3) echo "release=false" >>"$GITHUB_OUTPUT"; echo "No release needed." ;;
            *) exit "$code" ;;
          esac

      - name: Release
        id: release
        if: ${{ steps.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898496+github-actions[bot]@users.noreply.github.com"
          version="$(python3 scripts/release.py)"
          python3 scripts/release.py --notes "$version" >"$RUNNER_TEMP/notes.md"
          git add CHANGELOG.md plugins/*/.claude-plugin/plugin.json docs/site/package.json
          git commit -m "chore(release): $version"
          git tag -a "$version" -m "$version"
          # Rejected (and nothing published) if main moved since this run started;
          # the next run releases those commits too.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$version"
          # A draft until the package job below has attached the tarball: the
          # installer and update-check resolve "latest" to published releases only.
          gh release create "$version" --draft --title "$version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # Back-merge: bring the release commit and tag into dev, so its
          # plugin versions and CHANGELOG don't lag. dev's ruleset requires
          # pull requests and a personal-account repo can't let
          # github-actions bypass it, so this push is refused and warns with
          # the command the owner runs (on purpose: no deploy key or PAT).
          integ=dev
          if git ls-remote --exit-code --heads origin "$integ" >/dev/null 2>&1; then
            git fetch -q origin "$integ"
            git switch -q -C "$integ" "origin/$integ"
            if ! { git merge --no-ff -m "chore(release): merge $version back into $integ" "$version" && git push origin "$integ"; }; then
              git merge --abort 2>/dev/null || true
              echo "::warning::back-merge of $version into $integ failed; run: git switch $integ && git merge --no-ff $version && git push"
            fi
          fi

  # Builds the release package for the new tag, attests its provenance,
  # attaches it to the (draft) release and publishes the release. Only this
  # job holds id-token and attestations write. scripts/package.py --check runs
  # the same build without publishing (scripts/check.sh, on every PR).
  package:
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # attach assets to the release and publish it
      id-token: write # the OIDC token the attestation is signed with
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Build the package
        run: |
          python3 scripts/package.py --version "$VERSION" --out dist
          cp install.sh dist/install.sh
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ai-gent-${{ needs.release.outputs.version }}.tar.gz
            dist/install.sh

      - name: Attach to the release and publish it
        run: |
          gh release upload "$VERSION" "dist/ai-gent-$VERSION.tar.gz" dist/SHA256SUMS dist/install.sh --clobber
          gh release edit "$VERSION" --draft=false --latest

  report-failure:
    needs: [check, release, package]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/report-failure.yml
