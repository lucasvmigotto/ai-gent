name: rust-build

# Reusable (spec 032 FR-012): builds the ai-gent binary natively on six runners, smoke-tests each
# binary on its own OS and architecture, and uploads it as the artifact bin-<triple>. It holds
# read-only permissions and no secrets; releasing and attesting belong to release.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty means the caller's ref).
        type: string
        default: ""
      release:
        description: Release version embedded in the binary (AI_GENT_RELEASE), dev outside a release.
        type: string
        default: dev
      dry_run:
        description: A rehearsal; builds and uploads artifacts only.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # A retired or flaky arm64 Windows label must not block releases before the 3.0.0 gate (spec 032 risks).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false # becomes true at the 3.0.0 gate (spec 039)
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, exe: "", experimental: false }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, exe: "", experimental: false }
          - { target: aarch64-apple-darwin, os: macos-15, exe: "", experimental: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, exe: "", experimental: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, exe: ".exe", experimental: false }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, exe: ".exe", experimental: true }
    defaults:
      run:
        shell: bash
    env:
      AI_GENT_RELEASE: ${{ inputs.release }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The tree-sitter grammars of ai-gent-compact are C: the musl legs need a musl C compiler.
      - name: Install the musl C compiler
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install rustup when the runner image lacks it
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            case "$TARGET" in
              aarch64-pc-windows-msvc) url=https://win.rustup.rs/aarch64 ;;
              *) url=https://win.rustup.rs/x86_64 ;;
            esac
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version
          rustc -vV

      # release.py writes the crate versions and Cargo.lock together; a lock that disagrees fails here, before a build.
      - name: Cargo.lock is consistent with the manifests
        working-directory: rust
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build
        working-directory: rust
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke - the binary runs on its own OS and architecture
        working-directory: rust
        run: |
          set -eu
          bin="target/$TARGET/release/ai-gent$EXE"
          ls -l "$bin"
          out=$("$bin" version --json)
          echo "$out"
          echo "$out" | grep -q '"ok":true'
          echo "$out" | grep -q "\"target\":\"$TARGET\""
          echo "$out" | grep -q '"profile":"release"'
          "$bin" --version
          # A release build carries the tag: ai-gent --version equals the package VERSION (D23).
          if [ "$AI_GENT_RELEASE" != dev ]; then
            echo "$out" | grep -q "\"release\":\"$AI_GENT_RELEASE\""
            echo "$out" | grep -q "\"crate\":\"$AI_GENT_RELEASE\""
            "$bin" --version | grep -q "^ai-gent $AI_GENT_RELEASE ($TARGET)$"
          fi
          # doctor may fail on install_root only: a runner has no install.
          set +e
          dout=$("$bin" doctor --json)
          code=$?
          set -e
          echo "$dout"
          if [ "$code" -ne 0 ]; then
            test "$(echo "$dout" | grep -o '"status":"fail"' | wc -l)" -eq 1
            echo "$dout" | grep -q '"id":"install_root","status":"fail"'
          fi
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "binary $TARGET: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # The guard evaluator's parity suite (spec 033, T033) on every OS, with git on PATH for its sandbox
      # repositories. Rehearsals only: a release builds the tag that already passed them.
      - name: Test - the guard fixtures on this OS
        if: ${{ inputs.dry_run }}
        working-directory: rust
        run: cargo test --locked --target "$TARGET" -p ai-gent-core -p ai-gent -p ai-gent-compact

      # Guard latency (spec 033, FR-012, T053): the Linux x86_64 leg enforces the budget (p95 at most 15 ms);
      # the other legs print their numbers to the step summary and never fail the build (Windows has its own
      # budget, still to be measured). Rehearsals only, like the tests above.
      - name: Bench - guard latency (enforced on Linux x86_64, informational elsewhere)
        if: ${{ inputs.dry_run }}
        run: |
          set -u
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          check=--check
          [ "$TARGET" = x86_64-unknown-linux-musl ] || check=
          set +e
          "$py" scripts/bench-guard.py --impl bin $check --bin "rust/target/$TARGET/release/ai-gent$EXE" | tee bench.txt
          code=${PIPESTATUS[0]}
          # A shared runner is noisy (the slowest case read 11.7 ms once and 15.7 ms the next time against a
          # 15 ms budget): a failed check is measured once more, and only two misses in a row fail the build.
          if [ -n "$check" ] && [ "$code" -ne 0 ]; then
            echo "bench-guard: over budget, measuring once more"
            "$py" scripts/bench-guard.py --impl bin $check --bin "rust/target/$TARGET/release/ai-gent$EXE" | tee bench.txt
            code=${PIPESTATUS[0]}
          fi
          set -e
          { echo "### Guard latency ($TARGET)"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$check" ]; then
            echo "informational on $TARGET (exit $code ignored)"
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/ai-gent${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7
