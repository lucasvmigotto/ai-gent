name: check

# Pushes to main run this through release.yml (checks, then the release).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # github.workflow is the caller's name when release.yml calls this
      group: check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # install.sh tests clone this repository
          persist-credentials: false

      - name: Install tools
        env:
          CLAUDE_CODE_VERSION: 2.1.282
        run: |
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          pipx --version # check.sh runs its pinned shellcheck through pipx
          claude --version

      - name: Check
        run: scripts/check.sh
