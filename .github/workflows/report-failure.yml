name: report-failure

# Called by a workflow's last job, which runs only on failure: opens the
# "CI failing: <workflow> on <branch>" issue, or comments on the open one, so
# one failure is one issue (devsecops: references/failure-issues.md).
on:
  workflow_call:

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI failing: ${{ github.workflow }} on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          n=$(gh issue list --state open --label ci-failure --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN (commit $SHA)"
          else
            gh issue create --title "$TITLE" --label ci-failure --body "Run: $RUN (commit $SHA). Open the run for the failed job and step; close this issue once the workflow is green again."
          fi
