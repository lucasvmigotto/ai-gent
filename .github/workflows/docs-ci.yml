name: Docs CI

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/site/**"
      - "docs/product/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/product/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags for the site version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Resolve site version from the latest tag
        run: echo "AI_GENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs/site

      - name: Lint (Biome)
        run: bun run lint
        working-directory: docs/site

      - name: Typecheck
        run: bun run typecheck
        working-directory: docs/site

      - name: Unit tests
        run: bun run test
        working-directory: docs/site

      - name: Build
        run: bun run build
        working-directory: docs/site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://docs.lucasvmigotto.me/${{ github.event.repository.name }}

      - name: Assert the built entry uses the repo prefix
        run: |
          # The site is served from /<repo>/; a build that emits root-relative
          # assets would 404 under the hub. CI derives the prefix from the
          # repository name, so this fails loudly if base and deploy drift.
          prefix="/${{ github.event.repository.name }}/"
          if ! grep -q "src=\"${prefix}assets/" docs/site/dist/index.html; then
            echo "::error::built index.html is missing ${prefix}assets/ — base path drift"
            exit 1
          fi

      - name: Guard prefix-scoped R2 deploy
        run: |
          # Fitness function: every R2 sync/cp must be prefix-scoped, so a
          # project can never wipe the shared bucket root.
          bad=$(grep -nE '^[[:space:]]+aws s3 (sync|cp)' .github/workflows/docs-ci.yml | grep -v 'R2_PREFIX' || true)
          if [ -n "$bad" ]; then
            echo "::error::root-scoped R2 target detected — every deploy must use \$R2_PREFIX"
            echo "$bad"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs/site/dist/
          retention-days: 7
          if-no-files-found: error

  e2e:
    # Containerized-browser smoke (no host driver). Advisory: deploy gates on
    # verify, so a browser-image hiccup cannot block publishing.
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs/site

      - name: Build
        run: bun run build
        working-directory: docs/site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://docs.lucasvmigotto.me/${{ github.event.repository.name }}

      - name: Start containerized Chrome
        # --network host so the browser can reach the site served on the runner
        # (a container cannot see the host's 127.0.0.1 otherwise). Pinned by
        # digest; the tag is the comment (containers rule §3).
        run: |
          docker run -d --name ai-gent-chrome --network host --shm-size=2g \
            selenium/standalone-chrome:153.0@sha256:7efe71e7e4a83bdf574b26bd354690928075e8f443223d2ced16a2c208eae1d7

      - name: Wait for Chrome
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4444/wd/hub/status >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::selenium grid did not start"
          docker logs ai-gent-chrome | tail -50
          exit 1

      - name: Serve the built site
        run: nohup bunx vite preview --host 127.0.0.1 --port 4173 --strictPort >"$RUNNER_TEMP/preview.log" 2>&1 &
        working-directory: docs/site

      - name: Wait for the site
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/${{ github.event.repository.name }}/" >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::preview server did not start"
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Smoke the site in Chrome
        run: bun run e2e
        working-directory: docs/site
        env:
          SITE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
          SELENIUM_URL: http://127.0.0.1:4444

      - name: Stop Chrome
        if: always()
        run: docker rm -f ai-gent-chrome || true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ai-gent-docs
      url: https://docs.lucasvmigotto.me/ai-gent/
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_ID }}
      # Per-project prefix in the shared docs-hub bucket. The slug is the
      # repository name — no per-repo configuration, cannot drift.
      R2_PREFIX: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags for the site version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Resolve site version from the latest tag
        run: echo "AI_GENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> "$GITHUB_ENV"

      - name: Install and build
        run: bun install --frozen-lockfile && bun run build
        working-directory: docs/site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://docs.lucasvmigotto.me/${{ github.event.repository.name }}

      - name: Check R2 credentials
        id: creds
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 credentials not configured — skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate R2 configuration
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -z "$R2_ENDPOINT" ]; then echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"; exit 1; fi
          case "$R2_ENDPOINT" in https://*) ;; *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $R2_ENDPOINT)"; exit 1;; esac
          if [ -z "$R2_BUCKET" ]; then echo "::error::CLOUDFLARE_R2_BUCKET_ID repo variable is not set"; exit 1; fi
          case "$R2_PREFIX" in /*/) ;; *) echo "::error::R2_PREFIX must look like /<slug>/ (got: '$R2_PREFIX')"; exit 1;; esac

      # Prefix-scoped deploy into the shared docs-hub bucket.
      # NEVER sync with --delete on the bucket root — that would wipe
      # the other apps' prefixes and the landing.
      - name: Sync hashed assets (immutable)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/assets "s3://$R2_BUCKET${R2_PREFIX}assets" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync entry files (no-cache)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 cp docs/site/dist/index.html "s3://$R2_BUCKET${R2_PREFIX}index.html" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3 cp docs/site/dist/favicon.svg "s3://$R2_BUCKET${R2_PREFIX}favicon.svg" \
            --endpoint-url "$R2_ENDPOINT" --content-type "image/svg+xml" --cache-control "public, max-age=604800"

      # LLM-readable entry points (no-cache), and one Markdown page per route
      # and locale, all under the project prefix.
      - name: Sync LLM entry files (no-cache)
        if: steps.creds.outputs.present == 'true'
        run: |
          for f in docs/site/dist/llms*.txt; do
            aws s3 cp "$f" "s3://$R2_BUCKET${R2_PREFIX}$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
          done

      - name: Sync Markdown pages (no-cache)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/docs "s3://$R2_BUCKET${R2_PREFIX}docs" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --content-type "text/markdown; charset=utf-8" --cache-control "no-cache"
